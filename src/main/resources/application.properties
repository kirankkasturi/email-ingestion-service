spring.application.name=email-ingestion-service
server.port=8080

# Disable unnecessary Spring Boot autoconfiguration for a lean standalone service
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

logging.level.com.platform.ingestion=DEBUG
